# Publicacao da imagem no GHCR. Disparo unico: tag `vX.Y.Z`.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Nao existe `latest`, de proposito: o resultado da extracao do grafo depende
# da versao, e uma tag movel apagaria a rastreabilidade do que gerou o grafo
# que esta no ar. O que vai para o registro de evidencia e o DIGEST, que sai
# no summary do job — tag pode ser movida, digest nao.
name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A suite inteira roda antes. Publicar sem passar por ela nao e possivel:
  # o job de build depende deste.
  testes:
    uses: ./.github/workflows/ci.yml

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Derivar a tag da imagem
        id: versao
        # A tag do git e `v0.1.0`; a da imagem e `0.1.0`, que e o valor que o
        # operador poe em ELEPHANT_TAG no stack.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '${GITHUB_REF_NAME}' fora do formato vX.Y.Z."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "imagem=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/elephant-memory" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # O Swarm da IP2 e x86. Runner e x86 tambem, entao nao ha emulacao.
          platforms: linux/amd64
          tags: ${{ steps.versao.outputs.imagem }}:${{ steps.versao.outputs.tag }}
          # Manifesto simples, sem indice de atestacao: e o que o `docker
          # stack deploy` puxa sem surpresa.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrar o digest no summary
        run: |
          {
            echo "## Imagem publicada"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Tag | \`${{ steps.versao.outputs.tag }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo 'Para o stack:'
            echo
            echo '```'
            echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}"
            echo "ELEPHANT_TAG=${{ steps.versao.outputs.tag }}"
            echo '```'
            echo
            echo 'Registro de evidencia — imutavel, use este e nao a tag:'
            echo
            echo '```'
            echo "${{ steps.versao.outputs.imagem }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
